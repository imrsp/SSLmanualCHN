name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the stable version format vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged revision $GITHUB_SHA is not part of origin/main." >&2
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install fonttools for font subsetting
        run: pip install "fonttools[woff]"

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        run: npm run check

      - name: Prepare release notes and archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          node scripts/extract_release_notes.mjs "$RELEASE_TAG" CHANGELOG.md release-notes.md
          ARCHIVE_NAME="SSLmanualCHN-${RELEASE_TAG}.zip"
          (
            cd dist
            zip -9 -r "../${ARCHIVE_NAME}" .
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            "SSLmanualCHN-${RELEASE_TAG}.zip" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md
